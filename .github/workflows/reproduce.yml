name: Reproduce results

on:
  push:
    branches: [main]
  pull_request:

jobs:
  reproduce:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pandas numpy
      - name: Rerun the pipeline
        run: python analysis.py
      - name: Fail if the committed outputs no longer match
        run: git diff --exit-code -- toll_plazas_clean.csv cleaning_log.csv
